# VyOS の設定ファイル（vyos/*.cmds）が、VyOS rolling で実際に commit できるかを検査する。
#
# 何を検査するか:
#   - vyos/VERSION で固定した rolling の ISO から作ったコンテナ（home-router/vyos:rolling）を、
#     eth0〜eth2 の 3 本の veth 付きで起動する
#   - フェーズ1（vyos/phase1.cmds）を入れて commit し、それを基準（CLAUDE.md §8 の baseline）にする
#   - 差分（チューニング①〜④、フェーズ2の MAP-E、QoS の NGN-OUT）を、基準に戻してから 1 本ずつ入れて
#     commit できるかを見る。差分同士は独立に検査する
#   - veth では検証できない行は vyos/container-unsupported.txt に理由つきで載せ、その行だけ除いて検査する。
#     載せた行が実は通る、または載っていない行が落ちる、のどちらでも失敗にする
#   - QoS は commit 後に eth2 の tc filter に pedit（set-dscp）が入ったことまで確かめる
#   - あわせてシェルスクリプトを shellcheck にかける
# 何を検査しないか: 性能（10G の転送性能は実機の試験 T0〜T8 で測る）、§6-5（本番向け）。
# workflow_call: vyos-bump.yaml が、上げる候補の版（vyos-version / vyos-iso-sha256）を渡して同じ検査を
#   再利用する。渡されたときだけ、検査の前に作業ツリーの vyos/VERSION の 2 行を書き換える（push はしない）。
name: VyOS config

on:
  pull_request:
  push:
    branches: ["king's"]
  workflow_dispatch:
  workflow_call:
    inputs:
      vyos-version:
        description: 検査に使う VyOS rolling のリリース名（空なら vyos/VERSION のまま）
        type: string
        default: ""
      vyos-iso-sha256:
        description: その ISO の sha256
        type: string
        default: ""

permissions:
  contents: read

jobs:
  commit-check:
    name: commit check in VyOS container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Override VyOS version (workflow_call)
        if: inputs.vyos-version != ''
        env:
          VYOS_VERSION: ${{ inputs.vyos-version }}
          VYOS_ISO_SHA256: ${{ inputs.vyos-iso-sha256 }}
        run: |
          python3 scripts/vyos-bump.py write --version "${VYOS_VERSION}" --sha256 "${VYOS_ISO_SHA256}"
          git diff -- vyos/VERSION

      - name: shellcheck
        run: shellcheck scripts/build-vyos-image.sh scripts/vyos-*.sh

      - name: Prepare VyOS image
        id: vyos
        uses: ./.github/actions/vyos-image

      - name: Check vyos/*.cmds
        env:
          VYOS_IMAGE: ${{ steps.vyos.outputs.image }}
        run: >-
          bash scripts/vyos-config-check.sh
          vyos/phase1.cmds
          vyos/tuning-1-offload.cmds
          vyos/tuning-2-rps.cmds
          vyos/tuning-3-flowtable.cmds
          vyos/tuning-4-performance.cmds
          vyos/phase2-mape.cmds
          vyos/qos-ngn-out.cmds
